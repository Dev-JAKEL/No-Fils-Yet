<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSL-Canary & Virtual Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0e27 0%, #000000 100%);
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 50px 160px, #ddd, transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 130px 80px, #fff, transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.7), transparent);
            background-size: 200px 200px;
            animation: stars 20s linear infinite;
            opacity: 0.6;
            z-index: 0;
        }
        @keyframes stars {
            from { transform: translateY(0); }
            to { transform: translateY(-200px); }
        }
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 50px 60px;
            background: rgba(10, 14, 39, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.1), inset 0 0 60px rgba(0, 255, 255, 0.05);
            animation: glowPulse 3s ease-in-out infinite alternate;
            max-width: 90%;
        }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 40px rgba(0, 255, 255, 0.1), inset 0 0 40px rgba(0, 255, 255, 0.02); }
            100% { box-shadow: 0 0 80px rgba(0, 255, 255, 0.25), inset 0 0 80px rgba(0, 255, 255, 0.08); }
        }
        .title {
            font-family: 'Orbitron', monospace;
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00f0ff, #7b2ffc, #00f0ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 4s ease-in-out infinite;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.3);
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .subtitle {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: rgba(0, 240, 255, 0.7);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.15);
            padding-bottom: 15px;
            display: inline-block;
        }
        .download-btn {
            position: relative;
            display: inline-block;
            padding: 18px 60px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00c6ff, #7b2ffc);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 30px rgba(0, 198, 255, 0.3);
            text-decoration: none;
            overflow: hidden;
        }
        .download-btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #00f0ff, #7b2ffc, #00f0ff);
            background-size: 300% 300%;
            border-radius: 62px;
            z-index: -1;
            animation: borderGlow 3s ease-in-out infinite;
            filter: blur(8px);
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .download-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 0 60px rgba(0, 198, 255, 0.6);
        }
        .download-btn:active { transform: scale(0.95); }
        .download-btn .icon {
            display: inline-block;
            margin-right: 12px;
            font-size: 1.8rem;
            animation: bounceArrow 1.5s ease-in-out infinite;
        }
        @keyframes bounceArrow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .line-deco {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
            margin: 15px auto;
            border-radius: 2px;
            opacity: 0.6;
        }
        .version {
            margin-top: 25px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 3px;
        }
        @media (max-width: 600px) {
            .container { padding: 30px 25px; }
            .title { font-size: 1.8rem; }
            .download-btn { padding: 14px 35px; font-size: 1.2rem; }
            .subtitle { font-size: 0.9rem; letter-spacing: 3px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">⚡ JL-Files</div>
        <div class="subtitle">&amp; Fast Download Method</div>
        <div class="line-deco"></div>
        <a href="#" target="_blank" class="download-btn" id="downloadBtn">
            <span class="icon">⬇</span> Download
        </a>
        <div class="version">v2.0.1 • secure</div>
    </div>
    <script>
        document.getElementById('downloadBtn').addEventListener('click', function(e) {
            const originalText = this.innerHTML;
            this.innerHTML = '<span class="icon">⏳</span> Redirecting...';
            this.style.opacity = '0.7';
            setTimeout(() => {
                this.innerHTML = originalText;
                this.style.opacity = '1';
            }, 1500);
        });
    </script>
</body>
</html>
